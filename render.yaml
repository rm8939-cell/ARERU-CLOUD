services:
  - type: web
    name: areru-cloud
    runtime: python
    # メモリ実測: 常駐 ~80MB / JRA 予想ページ描画で +45MB。
    # Free・Starter は RAM 512MB 同じ。Free は 0.1CPU に加えて
    #   - 15 分無アクセスでスピンダウン（復帰 60〜90 秒 = ユーザーからは白画面）
    #   - zero-downtime deploy 非対応（デプロイ中は落ちる）
    # という制約があるため、下の keepalive / データ同期で回避している。
    # 恒久的に安定させるなら Standard（2GB / 1CPU）、最低でも Starter を推奨。
    plan: free
    # Python は .python-version（3.14）で固定。Render の既定バージョンが動くと
    # 標準ライブラリの差でいきなり 500 を吐きうるため、暗黙の既定に依存しない。
    buildCommand: pip install -r requirements.txt
    # gunicorn の細かい設定は gunicorn_conf.py（preload / gthread / タイムアウト）
    startCommand: gunicorn -c gunicorn_conf.py web_app:app
    healthCheckPath: /healthz
    # データ更新（GitHub Actions のコミット）で再デプロイしない。
    # 再デプロイは Free では停止をともない、それが白画面の直接原因だった。
    # 稼働中のプロセスが data_sync.py で GitHub から data/ を取り込む。
    # ※ ダッシュボードで作成したサービスには Blueprint が効かないため、
    #   コミットメッセージ側にも [skip render] を入れて二重に防いでいる。
    buildFilter:
      ignoredPaths:
        - data/**
    envVars:
      - key: ARERU_SKIP_BOOT
        value: "1"
      - key: ARERU_SIM_RUNS
        value: "20000"
      - key: ARERU_ORDERS_KEEP_MAX
        value: "20000"
      - key: ARERU_FAST_NAR
        value: "1"
      - key: ARERU_FETCH_BUDGET_SEC
        value: "240"
      # 0.1CPU / 512MB では本生成を始めると Web 応答が止まるため、
      # Render は配信専用。データは GitHub Actions が生成して commit する。
      - key: ARERU_ENABLE_GENERATION
        value: "0"
      # 配信データの取り込み（再デプロイなしで最新化）
      - key: ARERU_DATA_SYNC
        value: "1"
      - key: ARERU_DATA_SYNC_INTERVAL
        value: "300"
      # 15 分スピンダウン対策の自己 ping（外部 ping は keepalive.yml）
      # ※ 常時起動は Free の 750 インスタンス時間/月をほぼ使い切る（1 か月 ≒ 730 時間）。
      #   他に Free の web service があるなら "0" にするか有料プランへ。
      - key: ARERU_KEEPALIVE
        value: "1"
      - key: ARERU_KEEPALIVE_INTERVAL
        value: "300"
# データ生成: .github/workflows/nar-daily-data.yml
#   Actions 上で runners/predictions を作り main に commit（[skip render]）→
#   /api/data-sync を叩いて稼働中のインスタンスへ反映。デプロイは起きない。
# 死活監視: .github/workflows/keepalive.yml が 5 分ごとに /healthz を叩き、
#   スピンダウンを防ぎつつ落ちていれば起こす。
#   .github/workflows/nar-display-monitor.yml が JRA・地方の表示を確認する。
