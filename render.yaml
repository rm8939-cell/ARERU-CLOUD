services:
  - type: web
    name: areru-cloud
    runtime: python
    # メモリ実測: ページ表示 ~100MB / 予想子プロセス ~150MB+ / 同時起動で 512MB 超過→再起動→白画面
    # Free・Starter は RAM 512MB 同じ。Free は 0.1CPU + スリープで日次取得が不安定。
    # 推奨: Standard（2GB / 1CPU）。最低でも Starter（CPU改善・スリープなし）。
    plan: free
    buildCommand: pip install -r requirements.txt
    # workers=1 / threads=1 必須。max-requests でメモリ断片化を定期回収。
    # timeout は Web 応答用（重いジョブはバックグラウンド）。短めにしてハングを検知。
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 90 --graceful-timeout 30 --max-requests 80 --max-requests-jitter 20 --worker-class sync
    envVars:
      - key: ARERU_SKIP_BOOT
        value: "1"
      - key: ARERU_SIM_RUNS
        value: "20000"
      - key: ARERU_ORDERS_KEEP_MAX
        value: "20000"
      - key: ARERU_FAST_NAR
        value: "1"
      - key: ARERU_FETCH_BUDGET_SEC
        value: "240"
      # 0.1CPU / 512MB では本生成を始めると Web 応答が止まるため、
      # Render は配信専用。データは GitHub Actions が生成して commit する。
      - key: ARERU_ENABLE_GENERATION
        value: "0"
# データ生成: .github/workflows/nar-daily-data.yml
#   Actions 上で runners/predictions を作り main に commit → Render が再デプロイ。
#   モードは「当日 predictions があるか」で決める（schedule は数時間遅延するため）。
# 死活監視: .github/workflows/nar-daily.yml が /healthz を叩いて配信データの
#   最新日付を出力する。重い cron は叩かない。
