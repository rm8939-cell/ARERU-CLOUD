# Render 起動 + 日次 cron（NAR→JRA 直列）
# 目標: 毎朝 08:00 JST までに予想完成。以降は odds 更新のみ。
# 重要: ページ wake は /healthz のみ（/?source=... はジョブ起動して OOM しやすい）
name: NAR daily wake

on:
  schedule:
    # --- 朝の本生成（JST）: 05:15 / 06:15 / 07:15 / 07:45 ---
    - cron: '15 20 * * *'   # 05:15 JST
    - cron: '15 21 * * *'   # 06:15 JST
    - cron: '15 22 * * *'   # 07:15 JST
    - cron: '45 22 * * *'   # 07:45 JST
    # --- 締切後 odds のみ（JST）: 09:00 / 12:00 / 15:00 ---
    - cron: '0 0 * * *'     # 09:00 JST
    - cron: '0 3 * * *'     # 12:00 JST
    - cron: '0 6 * * *'     # 15:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning | odds | auto'
        required: false
        default: 'auto'

jobs:
  wake-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake app and run daily cron (serialized)
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          BASE="${APP_URL:-https://areru-cloud.onrender.com}"
          BASE="${BASE%/}"
          # UTC hour → mode（20–22 UTC = 05–07 JST は morning）
          HOUR_UTC=$(date -u +%H)
          MIN_UTC=$(date -u +%M)
          if [ -n "${MODE_INPUT:-}" ] && [ "${MODE_INPUT}" != "auto" ]; then
            MODE="${MODE_INPUT}"
          elif [ "${HOUR_UTC}" = "20" ] || [ "${HOUR_UTC}" = "21" ] || [ "${HOUR_UTC}" = "22" ]; then
            MODE="morning"
          else
            MODE="odds"
          fi
          echo "mode=${MODE} utc=${HOUR_UTC}:${MIN_UTC}"
          echo "Waking ${BASE}/healthz ..."
          # ページではなく healthz（ジョブ起動なし）
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/healthz.json -w "%{http_code}" --max-time 90 \
              "${BASE}/healthz" || echo "000")
            echo "wake_try=${i} http=${code}"
            head -c 200 /tmp/healthz.json || true
            echo
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 10
          done
          sleep 5
          if [ -n "${CRON_TOKEN:-}" ]; then
            Q="?token=${CRON_TOKEN}&mode=${MODE}"
          else
            Q="?mode=${MODE}"
          fi
          # NAR→JRA はサーバー側で直列。個別 cron の同時叩きはしない。
          URL="${BASE}/cron/daily${Q}"
          echo "GET ${URL} ..."
          code=$(curl -sS -o /tmp/daily_cron.json -w "%{http_code}" --max-time 120 \
            -X GET "$URL" || echo "000")
          echo "daily_cron_http=${code}"
          head -c 400 /tmp/daily_cron.json || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then
            sleep 20
            curl -fsS --max-time 120 -X GET "$URL" || true
          fi
