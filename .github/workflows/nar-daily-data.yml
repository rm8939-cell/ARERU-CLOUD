# GitHub 上で本日の runners/predictions を取得して commit
# 目標: 毎朝 08:00 JST までに predictions を完成させる
name: NAR daily data

on:
  schedule:
    # 朝の本生成（JST）: 05:00 / 06:00 / 07:00 / 07:40
    - cron: '0 20 * * *'    # 05:00 JST
    - cron: '0 21 * * *'    # 06:00 JST
    - cron: '0 22 * * *'    # 07:00 JST
    - cron: '40 22 * * *'   # 07:40 JST
    # 締切後: オッズ・取消のみ（12:00 JST）
    - cron: '0 3 * * *'     # 12:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning | odds | auto'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  refresh-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Refresh NAR + JRA (morning full / post-8 odds)
        env:
          TZ: Asia/Tokyo
          ARERU_SKIP_NAR_BOOT: '1'
          ARERU_SKIP_BOOT: '1'
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          TODAY=$(date +%F)
          HOUR=$(date +%H)
          if [ -n "${MODE_INPUT:-}" ] && [ "${MODE_INPUT}" != "auto" ]; then
            MODE="${MODE_INPUT}"
          elif [ "${HOUR}" -lt 8 ]; then
            MODE="morning"
          else
            MODE="odds"
          fi
          echo "Racing refresh date=${TODAY} mode=${MODE} hour=${HOUR}"

          TODAY="${TODAY}" python - <<'PY'
          import os
          from daily_ops import jra_is_race_day, nar_is_race_day
          day = os.environ["TODAY"]
          print(f"race_day nar={nar_is_race_day(day)} jra={jra_is_race_day(day)}")
          PY

          if [ "${MODE}" = "odds" ]; then
            python refresh_data.py --dates "${TODAY}" --source nar --odds-only --skip-predict || echo "NAR odds soft-fail"
            python refresh_data.py --dates "${TODAY}" --source jra --odds-only --skip-predict || echo "JRA odds soft-fail"
            # ランク再計算はしない（封印維持）。オッズパッチのみ
            python - <<PY
          from pathlib import Path
          import pandas as pd
          from areru_engine import parse_date

          day = "${TODAY}"
          arch = Path("data/predictions_by_date") / f"predictions_{day}.csv"
          rp = Path("data/runners.csv")
          if not arch.exists() or not rp.exists():
              raise SystemExit(0)
          runners = pd.read_csv(rp, encoding="utf-8-sig")
          pred = pd.read_csv(arch, encoding="utf-8-sig")
          runners["日付"] = parse_date(runners["日付"]).dt.strftime("%Y-%m-%d")
          day_r = runners[runners["日付"] == day]
          odds = {}
          for _, row in day_r.iterrows():
              rid = str(row.get("race_id") or "").strip()
              ban = str(row.get("馬番") or "").strip()
              try:
                  win = float(row.get("単勝オッズ") or 0)
              except Exception:
                  win = 0.0
              if rid and ban and win > 0:
                  odds[(rid, ban)] = (win, row.get("人気"))
                  odds[(rid, ban.zfill(2))] = (win, row.get("人気"))
          n = 0
          for idx in pred.index:
              rid = str(pred.at[idx, "race_id"] or "").strip()
              ban = str(pred.at[idx, "本命馬番"] or "").strip()
              info = odds.get((rid, ban)) or odds.get((rid, ban.zfill(2) if ban.isdigit() else ban))
              if not info:
                  continue
              pred.at[idx, "本命オッズ"] = info[0]
              if info[1] not in (None, "") and "本命人気" in pred.columns:
                  pred.at[idx, "本命人気"] = info[1]
              n += 1
          if n:
              pred.to_csv(arch, index=False, encoding="utf-8-sig")
          print(f"odds patch n={n}")
          from daily_ops import write_seal
          write_seal(day, sources=["nar", "jra"], note="gha_odds", mode="odds")
          PY
            exit 0
          fi

          # morning: 開催取得 → 予想本生成
          python refresh_data.py --dates "${TODAY}" --source nar --skip-predict || echo "NAR refresh soft-fail"
          python refresh_data.py --dates "${TODAY}" --source jra --skip-predict || echo "JRA refresh soft-fail"
          if ! python - <<PY
          import pandas as pd
          from pathlib import Path
          from areru_engine import parse_date
          day = "${TODAY}"
          p = Path("data/runners.csv")
          if not p.exists():
              raise SystemExit(1)
          days = parse_date(pd.read_csv(p, encoding="utf-8-sig", usecols=["日付"])["日付"]).dt.strftime("%Y-%m-%d")
          raise SystemExit(0 if days.eq(day).any() else 1)
          PY
          then
            echo "No runners for ${TODAY}; skip predict (休催日)"
            exit 0
          fi
          python replay_predict.py "${TODAY}"
          test -s "data/predictions_by_date/predictions_${TODAY}.csv"
          RANK_CHECK_DATE="${TODAY}" python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          from ev_analysis import assert_predictions_finalized, predictions_are_finalized
          from daily_ops import write_seal
          day = os.environ["RANK_CHECK_DATE"]
          p = Path(f"data/predictions_by_date/predictions_{day}.csv")
          df = pd.read_csv(p, encoding="utf-8-sig")
          assert_predictions_finalized(df, label=p.name)
          assert "相対ランク" in df.columns
          pending = df["投資判定"].astype(str).str.contains("判定待", na=False).mean()
          assert pending < 0.2, f"pending={pending:.2%}"
          print("rank finalize ok:", predictions_are_finalized(df))
          srcs = sorted({str(s).lower() for s in df.get("source", pd.Series(dtype=str)).dropna().unique() if str(s).lower() in ("jra", "nar")}) or ["nar", "jra"]
          write_seal(day, sources=srcs, note="gha_morning", mode="morning")
          print("sealed sources=", srcs)
          PY

      - name: Commit and push data
        env:
          TZ: Asia/Tokyo
        run: |
          set -euo pipefail
          TODAY=$(date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/runners.csv \
            "data/predictions_by_date/predictions_${TODAY}.csv" \
            "data/predictions_by_date/scores_${TODAY}.csv" \
            data/odds_tickets \
            data/predict_seals || true
          if git diff --staged --quiet; then
            echo "No data changes for ${TODAY}"
            exit 0
          fi
          git commit -m "chore: racing daily data ${TODAY}"
          git push
