# 地方表示の24時間監視（開催場・レース一覧・予想）
name: NAR display monitor

on:
  schedule:
    # 毎時（JST 全時間帯をカバー）
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check NAR venues / races / predictions
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          set -euo pipefail
          BASE="${APP_URL:-https://areru-cloud.onrender.com}"
          export APP_URL="$BASE"
          # wake
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/healthz.json -w "%{http_code}" --max-time 90 "${BASE}/healthz" || echo 000)
            echo "wake=$i http=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 8
          done
          python3 scripts/monitor_nar_display.py
