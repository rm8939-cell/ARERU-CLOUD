# Trigger a Render deploy of main after UI (and data) lands.
# Auto-deploy from GitHub is not always on; a Deploy Hook / API key
# in repo secrets is the reliable path to production.
name: Render deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          HOOK2: ${{ secrets.RENDER_DEPLOY_HOOK }}
          KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          URL="${HOOK:-}"
          if [ -z "$URL" ]; then
            URL="${HOOK2:-}"
          fi
          if [ -n "$URL" ]; then
            echo "Calling Render deploy hook"
            curl -fsS -X GET "$URL"
            echo
            exit 0
          fi
          if [ -n "${KEY:-}" ]; then
            echo "Listing Render services"
            RESP=$(curl -fsS -H "Authorization: Bearer ${KEY}" \
              "https://api.render.com/v1/services?limit=50")
            export RESP
            SID=$(python3 -c 'import json,os; d=json.loads(os.environ.get("RESP") or "[]"); rows=d if isinstance(d,list) else (d.get("data") or []); svcs=[(r.get("service") if isinstance(r,dict) and "service" in r else r) for r in rows]; named=next((s.get("id") for s in svcs if isinstance(s,dict) and str(s.get("name") or "")=="areru-cloud" and s.get("id")), ""); first=next((s.get("id") for s in svcs if isinstance(s,dict) and s.get("id")), ""); print(named or first or "")')
            if [ -z "$SID" ]; then
              echo "RENDER_API_KEY set but no service id found"
              exit 1
            fi
            echo "Creating deploy for ${SID}"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}' \
              "https://api.render.com/v1/services/${SID}/deploys"
            echo
            exit 0
          fi
          echo "No RENDER_DEPLOY_HOOK_URL / RENDER_DEPLOY_HOOK / RENDER_API_KEY secret."
          echo "Git push alone must trigger Render auto-deploy."
          exit 0
